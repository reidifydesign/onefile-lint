<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good page</title>
<style>
:root { --bg: #ffffff; --fg: #1a1a1a; --accent: #0b5fff; }
@media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #f2f2f2; --accent: #8ab4ff; } }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; min-height: 100dvh; }
a { color: var(--accent); }
.card { transition: transform .2s; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
button:focus-visible { outline: 3px solid var(--accent); }
@media print { body { background: #fff; color: #000; } nav { display: none; } }
</style>
</head>
<body>
<main>
  <h1>Hello</h1>
  <p>This page is self-contained. It has a label for every field, real button text, and it says what it needs. It has enough words in it that the landmark and print checks treat it as a real page with real content to read.</p>
  <label for="name">Name</label>
  <input id="name" type="text">
  <label>Email <input type="email"></label>
  <button type="button">Save</button>
  <a href="#top">Top</a>
  <img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
  <div class="card">Card</div>
</main>
<script>
document.querySelector('button').addEventListener('click', () => { document.title = 'Saved'; });
</script>
</body>
</html>
